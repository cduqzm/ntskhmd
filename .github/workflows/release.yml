name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check tag matches project version
        run: |
          project_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ValCC.csproj)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match ValCC.csproj version $project_version"
            exit 1
          fi

      - name: Build ntskhmd.zip
        run: |
          dotnet publish ValCC.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o ntskhmd
          pwsh -Command "Compress-Archive -Path ntskhmd -DestinationPath ntskhmd.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ntskhmd.zip \
            --title "ntskhmd $GITHUB_REF_NAME" \
            --generate-notes
